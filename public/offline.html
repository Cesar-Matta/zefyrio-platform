<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zefyrio — Sin Señal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0c0e18;
      color: #e1e1f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .grid-bg {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }
    .container { position: relative; z-index: 1; max-width: 320px; }
    .icon-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(255, 0, 85, 0.08);
      border: 1px solid rgba(255, 0, 85, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-glow 3s ease-in-out infinite;
    }
    .icon-wrap svg { width: 36px; height: 36px; color: #ff0055; }
    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      color: #ff0055;
    }
    .subtitle {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #b9cacb;
      margin-bottom: 1.5rem;
    }
    .message {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #b9cacb;
      margin-bottom: 2rem;
    }
    .retry-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }
    .status-bar {
      position: fixed;
      bottom: 2rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #ff005580;
      font-family: monospace;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.1); }
      50% { box-shadow: 0 0 40px rgba(255, 0, 85, 0.2); }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>SIN SEÑAL</h1>
    <p class="subtitle">Enlace de Datos Perdido</p>
    <p class="message">
      No se detecta conexión a la red. La telemetría en tiempo real no está disponible. 
      Verifica tu conexión WiFi o datos móviles y vuelve a intentar.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Reconectar
    </button>
  </div>
  <div class="status-bar">ZEFYRIO • MODO OFFLINE • ÚLTIMA SYNC: N/A</div>
</body>
</html>
